name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Os banners ficam versionados junto ao Markdown em content/projects/<slug>/.
      # O Astro só publica arquivos estáticos que estão em public/, então copiamos
      # os banners antes do build para que também existam no artefato do GitHub Pages.
      - name: Prepare project banners
        run: |
          for project_dir in content/projects/*; do
            [ -d "$project_dir" ] || continue
            slug="$(basename "$project_dir")"
            for banner in "$project_dir"/banner.*; do
              [ -f "$banner" ] || continue
              mkdir -p "apps/blog/public/projects/$slug"
              cp "$banner" "apps/blog/public/projects/$slug/$(basename "$banner")"
            done
          done

      - name: Build blog
        env:
          BASE_PATH: /blog
          SITE_URL: https://molinete-magico.github.io
        run: npm run build --workspace=apps/blog

      # GitHub Pages de um site de usuário serve o repositório a partir da
      # raiz do domínio (molinete-magico.github.io). Como queremos o blog em
      # /blog/, o conteúdo do build é colocado dentro de uma pasta `blog/` no
      # artefato. O .nojekyll evita que o GitHub trate o conteúdo como Jekyll.
      - name: Package site inside /blog/
        run: |
          mkdir -p dist-pages/blog
          mv apps/blog/dist/* dist-pages/blog/
          touch dist-pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
