name: Check Writer and Blog

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/writer/**"
      - "apps/blog/**"
      - "content/projects/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/check-writer.yml"
      - ".github/workflows/deploy-blog.yml"
  push:
    branches: [feat/writer-projects]
    paths:
      - "apps/writer/**"
      - "apps/blog/**"
      - "content/projects/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/check-writer.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generate a compatible, audit-fixed lockfile in CI; the resulting
      # artifact is reviewed and committed separately after the build passes.
      - name: Apply compatible dependency security updates
        continue-on-error: true
        run: npm audit fix --package-lock-only

      - name: Install audited lockfile
        run: npm ci

      - name: Upload audited package lock
        uses: actions/upload-artifact@v4
        with:
          name: writer-audit-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Type-check Writer
        run: npm run check --workspace=apps/writer

      - name: Test Writer security guards
        run: npm run test --workspace=apps/writer

      - name: Audit dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Smoke test Astro dev server
        shell: bash
        run: |
          npm run dev --workspace=apps/blog -- --host 127.0.0.1 > /tmp/blog-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/blog/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/blog-dev.log
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:4321/blog/perfil.png >/dev/null
          curl --fail --silent http://127.0.0.1:4321/blog/projetos/sum/ >/dev/null

      - name: Build Writer
        run: npm run build --workspace=apps/writer

      - name: Build blog
        env:
          BASE_PATH: /blog
          SITE_URL: https://molinete-magico.github.io
        run: npm run build --workspace=apps/blog

      - name: Check generated links and assets
        env:
          BASE_PATH: /blog
        run: node scripts/check-built-site.mjs

  # One-time lockfile repair for this audit branch only. This job is removed
  # after the compatible npm updates have been committed.
  persist-audited-lock:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/site-audit-security-integrity' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          ref: fix/site-audit-security-integrity

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply compatible dependency updates
        run: npm audit fix --package-lock-only || true

      - name: Commit audited lockfile if changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): apply compatible npm audit updates"
            git push origin HEAD:fix/site-audit-security-integrity
          else
            echo "No compatible lockfile updates to commit."
          fi
