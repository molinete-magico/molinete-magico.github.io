name: Regenerate Playwright lockfile

on:
  push:
    branches: [test/writer-browser-interactions]
    paths:
      - "package.json"
      - "apps/writer/package.json"
      - ".github/workflows/regenerate-playwright-lock.yml"

permissions:
  contents: write

jobs:
  lockfile:
    if: "${{ !contains(github.event.head_commit.message, 'chore(deps): regenerate Playwright lockfile') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes were generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate Playwright lockfile"
          git push
