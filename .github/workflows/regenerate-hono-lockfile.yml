name: Regenerate Hono lockfile

on:
  push:
    branches: [chore/regenerate-hono-lockfile]
    paths:
      - "package-lock.json"
      - "apps/writer/package.json"
      - ".github/workflows/regenerate-hono-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, 'chore(deps): regenerate Hono lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Update Hono lockfile entry
        run: npm update hono --workspace=apps/writer --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes were generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate Hono lockfile"
          git push
