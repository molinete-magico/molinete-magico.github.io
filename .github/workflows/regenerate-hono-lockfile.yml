name: Regenerate Hono lockfile

on:
  push:
    branches: [chore/regenerate-hono-lockfile]
    paths:
      - "package-lock.json"
      - ".github/workflows/regenerate-hono-lockfile.yml"

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Update Hono lockfile entry
        run: npm update hono --workspace=apps/writer --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v6
        with:
          name: hono-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
